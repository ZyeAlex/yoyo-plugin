{{extend layout}}

{{block 'css'}}
<link rel="stylesheet" type="text/css" href="{{pluResPath}}/help/index.css" />
{{/block}}

{{block 'main'}}

<div class="help-page">
  <header class="help-hero">
    <span class="help-hero-bar" aria-hidden="true"></span>
    <h1 class="help-title">悠悠帮助</h1>
  </header>

  <section class="help-body">
    {{each helpGroup group}}
    <article class="help-group">
      <div class="help-group-head">
        <span class="help-group-ornament" aria-hidden="true"></span>
        <span class="help-group-title">{{group.group}}</span>
      </div>
      <div class="help-grid">
        {{each group.list help}}
        <div class="help-item">
          <div class="help-item-icon">
            <img src="{{pluResPath}}/UI/{{help.icon}}" alt="" />
          </div>
          <div class="help-item-text">
            <div class="help-item-cmd" style="{{style(help.style)}}">
              <span class="help-pfx">{{rulePrefix}}</span>{{help.title.replace(/^#/, '')}}
            </div>
            <div class="help-item-desc">{{help.desc}}</div>
          </div>
        </div>
        {{/each}}
      </div>
    </article>
    {{/each}}
  </section>

  <footer class="help-footer">
    <img class="help-footer-logo" src="{{pluResPath}}/common/theme/logo_c.png" alt="" />
    <span class="help-footer-name">yoyo-plugin</span>
  </footer>
</div>

{{/block}}
