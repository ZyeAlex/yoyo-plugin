[project]
name = "yoyo-sauce"
version = "0.1.0"
description = "YoYo QQ group Chat Brain"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
