# 指令前缀 若和别的游戏冲突，更换其他前缀即可
rulePrefix:
- "~"
- "～"
- "#?蓝原"
- "#?蓝色星原"

# 角色图片
imgMaxSize: 10 #上传图片大小限制 MB
imgPath:
#角色图片库的路径 从Bot根目录开始，如 'plugins/yoyo-image/' ，路径下须是以角色命名的文件夹
- plugins/yoyo-image
# todo
characterImgPath: [] #立绘图 无背景图片 
# todo
heroGuidePath: [] #角色攻略图
imgUpAuth: all # 图片上传权限 "master"|"admin"|"owner"|"all"
imgDelAuth: all # 图片删除权限 "master"|"admin"|"owner"|"all"
# 资源配置
# UI 图标从 BWIKI 下载，见 utils/UI.js
wikiLoreRefreshHours: 168 # BWIKI 背景页缓存有效期（小时），到期后插件启动/定时任务自动刷新

# 签到
sign: true # 开启签到
signWithdrawal: false # 签到撤回
signInclude: [] # 签到包含群聊
signExclude: [] # 签到排除群聊

# 群聊 Chat Brain（#安装悠悠 → server/）
chatEnabled: false
chatPort: 8787
chatInclude: [] # 白名单群；空=不监听
chatWakeWords:
  - 悠悠
  - 小悠
chatBufferSize: 20
chatMaxReplies: 2
chatReplyDelayMinMs: 500
chatReplyDelayMaxMs: 2000
chatInterruptEnabled: true
chatProactiveEnabled: true
chatHeatEnabled: true # 时间看群；关则仅硬触发
chatHeatDebounceSec: 1.5
chatHeatEngagedSec: 90 # 遗留，P0 不驱动
chatHeatObserveSec: 90 # 遗留，P0 不驱动
chatGlanceIdleSec: [1500, 3600]
chatGlanceChatSec: [20, 40]
chatGlanceFocusSec: [3, 8]
chatSpeakMinGapSec: [3, 5] # 两次决定开口的最短间隔，取左端
chatAtReactionSec: [2, 8] # 保留；不再在被 @ 后额外延迟
chatUnansweredGiveUpSec: 480
chatAttentionDecayPerMin: 0.92
chatDwellHotSec: [60, 180]
chatDwellChatSec: [30, 90]
chatDwellIdleSec: [10, 30]
chatBackoffRetrySec: [90, 300, 900, 1800, 3600]
chatBackoffAttentionFactor: 0.5
chatToolsEnabled: true
chatDrawMockDelaySec: 3
# 文本模型
chatLlmApiKey: ""
chatLlmBaseUrl: ""
chatLlmModel: deepseek-ai/DeepSeek-V4-Flash
# 多模态（看图 / 表情包打标）；空=跟文本模型
chatVisionBaseUrl: ""
chatVisionApiKey: ""
chatVisionModel: ""
# 图生成/编辑（无参考图→generations用 chatDrawModel；有图→edits/图生图用 chatDrawEditModel，空则跟主模型）
chatDrawBaseUrl: ""
chatDrawApiKey: ""
chatDrawModel: ""
chatDrawEditModel: ""
chatDrawSize: "1080x1920"
# 快速响应（是否接话等）；空=跟文本模型
chatFastBaseUrl: ""
chatFastApiKey: ""
chatFastModel: ""
# Embedding；空地址/Key=跟文本模型
chatEmbeddingEnabled: true
chatEmbeddingModel: BAAI/bge-m3
chatEmbeddingBaseUrl: ""
chatEmbeddingApiKey: ""
chatEmbeddingDim: 1024
# 记忆层
chatMemoryEnabled: true
chatSessionHistoryTurns: 20
chatMemoryMaxInjectChars: 900
chatGroupMemoryCharLimit: 2200
chatUserMemoryCharLimit: 800
chatDailyLogInjectChars: 600
chatSlangEnabled: true
chatSlangMaxInject: 8
chatExtractEnabled: true
chatRetrieveTopK: 4
chatMediaMaxBytes: 8388608
chatVisionEnabled: true
chatVisionMaxImages: 2
chatVisionIncludeRecentOnRefer: true
chatStickerCacheEnabled: true
chatStickerLibraryCap: 120
chatStickerReplyEnabled: true
chatStickerMaxPerReply: 1
chatStickerShelfEnabled: true
chatStickerShelfSize: 5
# 非斗图时注入表情货架的概率（斗图/对方发表情必开）。0=仅斗图；1=每轮都开
chatStickerShelfChance: 0.45
# 游戏图鉴（Chat 只读 data/game；L0 常驻世界观+自己）
chatGameKbEnabled: true
chatGameSelfHeroId: "101003"
chatGameL0MaxChars: 2800
chatGameLookupMax: 2
# 角色外观 look（本地立绘索引 data/cache/hero_imgs.json）
chatHeroLookEnabled: true
chatHeroLookMaxPerTurn: 1
# 联网搜索（无 API Key：DuckDuckGo HTML，不够再换 Bing）
chatWebSearchEnabled: true
chatWebSearchMaxResults: 10
# TTS（OpenAI 兼容 POST /v1/audio/speech；面板上传全局默认参考音色）
chatTtsEnabled: false
chatTtsInclude: []
chatTtsExclude: []
chatTtsBaseUrl: ""
chatTtsApiKey: ""
chatTtsModel: ""
chatTtsVoice: default
chatTtsSpeed: 1.0
chatTtsFormat: wav
chatTtsMaxChars: 80

