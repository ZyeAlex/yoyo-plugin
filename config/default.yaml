# 指令前缀 若和别的游戏冲突，更换其他前缀即可
rulePrefix:
- "~"
- "～"
- "#?蓝原"
- "#?蓝色星原"

# 角色图片
imgMaxSize: 10 #上传图片大小限制 MB
imgPath:
#角色图片库的路径 从Bot根目录开始，如 'plugins/yoyo-image/' ，路径下须是以角色命名的文件夹
- plugins/yoyo-image
# todo
characterImgPath: [] #立绘图 无背景图片 
# todo
heroGuidePath: [] #角色攻略图
imgUpAuth: all # 图片上传权限 "master"|"admin"|"owner"|"all"
imgDelAuth: all # 图片删除权限 "master"|"admin"|"owner"|"all"
# 资源配置
# UI 图标从 BWIKI 下载，见 utils/UI.js
wikiLoreRefreshHours: 168 # BWIKI 背景页缓存有效期（小时），到期后插件启动/定时任务自动刷新

# 签到
sign: true # 开启签到
signWithdrawal: false # 签到撤回
signInclude: [] # 签到包含群聊
signExclude: [] # 签到排除群聊

# 群聊 Chat Brain（#安装悠悠 → server/）
chatEnabled: false
chatPort: 8787
chatInclude: [] # 白名单群；空=不监听
chatWakeWords:
  - 悠悠
  - 小悠
chatBufferSize: 20
chatMaxReplies: 1
chatReplyDelayMinMs: 500
chatReplyDelayMaxMs: 2000
chatInterruptEnabled: true
chatProactiveEnabled: true
chatProactiveCooldownSec: 45
chatProactiveMaxPerMin: 3
chatHeatEnabled: true # 冷热温度调度；关则退回短问正则
chatToolsEnabled: true
chatDrawMockDelaySec: 3
# 文本模型
chatLlmApiKey: ""
chatLlmBaseUrl: ""
chatLlmModel: deepseek-ai/DeepSeek-V4-Flash
# 多模态（看图 / 表情包打标）；空=跟文本模型
chatVisionBaseUrl: ""
chatVisionApiKey: ""
chatVisionModel: ""
# 快速响应（是否接话等）；空=跟文本模型
chatFastBaseUrl: ""
chatFastApiKey: ""
chatFastModel: ""
# Embedding；空地址/Key=跟文本模型
chatEmbeddingEnabled: true
chatEmbeddingModel: BAAI/bge-m3
chatEmbeddingBaseUrl: ""
chatEmbeddingApiKey: ""
chatEmbeddingDim: 1024
# 记忆层
chatMemoryEnabled: true
chatSessionHistoryTurns: 20
chatMemoryMaxInjectChars: 900
chatGroupMemoryCharLimit: 2200
chatUserMemoryCharLimit: 800
chatDailyLogInjectChars: 600
chatSlangEnabled: true
chatSlangMaxInject: 8
chatExtractEnabled: true
chatRetrieveTopK: 4
chatMediaMaxBytes: 8388608
chatVisionEnabled: true
chatVisionMaxImages: 2
chatVisionIncludeRecentOnRefer: true
chatStickerCacheEnabled: true
chatStickerLibraryCap: 120
chatStickerReplyEnabled: true
chatStickerMaxPerReply: 1
chatStickerShelfEnabled: true
chatStickerShelfSize: 5

