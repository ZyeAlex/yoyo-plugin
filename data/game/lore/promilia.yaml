  - id: 弗利斯城邦
    title: 弗利斯城邦（Fleece City）
    level: 3
    text: |-
      以金色麦穗为象征，以文化多元闻名的城邦，曾是三个大国的交界地。
      很久很久以前，弗利斯还是一个名不见经传的荒野之地，在弗利斯先祖与奇波的合作下，通过农业与贸易逐步发展为了辰王朝，阿瓦利安，罗吉亚帝国这三国，乃至更广阔范围内的交易中心。
      弗利斯遗留有部分第三纪元时期留下的圆环状残骸。
      代表角色：
    charCount: 146
