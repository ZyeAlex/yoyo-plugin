  - id: 阿瓦利安
    title: 阿瓦利安（Averian）
    level: 3
    text: |-
      「万识汇聚之地」，以高等精灵族为主体，认为洛斯兰瑟的木精灵是守旧派。
      在弗利斯的西南方向的迷迹森林中，存在大量高精灵遗迹，其中有通往阿瓦利安的道路。据此可知，阿瓦利安位于弗利斯的西南方。
      代表角色：
