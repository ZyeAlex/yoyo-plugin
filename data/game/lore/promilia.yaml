  - id: 辰王朝
    title: 辰王朝（Chen Dynasty）
    level: 3
    text: |-
      镜花洲所属的国家，以中国为原型的国度。
      弗利斯有辰王朝的边关壬阳关，从地图上可知，辰王朝位于弗利斯的东南方。
      龙代之后，辰王朝阻拦了盛极一时的艾登兰的南征，艾登兰之王与当时辰王朝的统治者辰皇帝于壬阳关下爆发大战，其痕迹延续至今，被称为【终战之痕】。
      代表角色：、涂山芷霜
    charCount: 135
