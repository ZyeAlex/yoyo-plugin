  - id: 术语
    title: 术语
    level: 2
    text: |-
      卡拉玛：象征生命能量，赐万物以生命，构成世界循环的两种能量之一。
      苏亚：代表停滞虚无，构成世界循环的两种能量之一。
      星脉：流淌于普罗米利亚大陆之下，类似于地脉，是孕育生命的源泉。
      约：普罗米利亚大陆丈量时间的单位，目前分为「锦约」和「丰约」。「锦约」万物发芽，草木繁盛；「丰约」硕果满枝，白雪覆野。但目前概念存在矛盾之处，概念明确前建议仅作为时间单位使用。
