    title: 罗吉亚帝国（Rosier Empire）
    level: 3
    text: |-
      智人主导的国度，信仰至光女神，流行光明魔法。对兽人族有歧视与迫害行为。
      据姬瑟贝露所说，罗吉亚帝国最早传唱的教义中，并没有排斥和敌视兽人的内容。
      根据剧情信息，罗吉亚帝国位于夏露露村南方，和阿瓦利安有水路贸易。
